<!DOCTYPE html>
<html>
<head>
    <title>Editar Contacto</title>
</head>
<body>
    <h1>Editar Contacto</h1>

    <form action="/edit/{{ contact.id }}" method="POST">
        <label>Nombre:</label><br>
        <input type="text" name="name" value="{{ contact.name }}" required><br><br>

        <label>Teléfono:</label><br>
        <input type="text" name="phone" value="{{ contact.phone }}" required><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" value="{{ contact.email }}" required><br><br>

        <button type="submit">Actualizar</button>
    </form>

    <br>
    <a href="/">Volver al inicio</a>
</body>
</html>
